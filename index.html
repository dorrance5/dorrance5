<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dorrance.me</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F4F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<script>
try{const t=localStorage.getItem('theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
/* The TV Mount look: neutral grays, white cards, blue selection. Aurora is a secret theme. */
:root{
  --bg:#F4F4F5;--tile:#fff;--tile-line:rgba(0,0,0,.09);--tile-shadow:0 1px 1px rgba(0,0,0,.07),0 0 1px rgba(0,0,0,.16);
  --text:#1E2126;--muted:#60646C;--line:rgba(0,0,0,.1);--chip:rgba(0,0,0,.05);--chip-line:rgba(0,0,0,.12);
  --sel:#E9F2FF;--sel-line:#0C66E4;--sel-text:#0C66E4;--sheet:rgba(255,255,255,.97);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141517;--tile:#1F2023;--tile-line:rgba(255,255,255,.09);--tile-shadow:inset 0 1px 0 rgba(255,255,255,.04);--text:#E6E7E9;--muted:#A0A3A9;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.06);--chip-line:rgba(255,255,255,.13);--sel:#1C2B41;--sel-line:#579DFF;--sel-text:#85B8FF;--sheet:rgba(30,31,34,.97);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141517;--tile:#1F2023;--tile-line:rgba(255,255,255,.09);--tile-shadow:inset 0 1px 0 rgba(255,255,255,.04);--text:#E6E7E9;--muted:#A0A3A9;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.06);--chip-line:rgba(255,255,255,.13);--sel:#1C2B41;--sel-line:#579DFF;--sel-text:#85B8FF;--sheet:rgba(30,31,34,.97);color-scheme:dark}
:root[data-theme="aurora"]{--bg:#0E0A1E;--tile:rgba(255,255,255,.13);--tile-line:rgba(255,255,255,.26);--tile-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 12px rgba(0,0,0,.18);--text:#fff;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.28);--chip:rgba(255,255,255,.09);--chip-line:rgba(255,255,255,.18);--sel:rgba(255,255,255,.24);--sel-line:rgba(255,255,255,.5);--sel-text:#fff;--sheet:rgba(20,14,42,.82);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
main{max-width:880px;margin:0 auto;position:relative;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 24px;position:relative;z-index:5}
.menu-wrap{position:relative}
.round{width:46px;height:46px;border-radius:16px;border:.5px solid var(--tile-line);background:var(--tile);box-shadow:var(--tile-shadow);color:var(--text);cursor:pointer;
  display:grid;place-items:center;padding:0;transition:transform .08s}
.round:active{transform:scale(.94)}
.round svg{width:22px;height:22px}
.menu{position:absolute;right:0;top:56px;width:270px;background:var(--sheet);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:.5px solid var(--line);border-radius:20px;padding:14px 14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.18);animation:pop .15s ease-out}
.menu-label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px 2px;cursor:default;-webkit-user-select:none;user-select:none}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 img{width:36px;height:36px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{height:38px;border-radius:13px;border:.5px solid var(--chip-line);background:var(--chip);color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:0 8px;cursor:pointer}
.seg button.on{background:var(--sel);border-color:var(--sel-line);color:var(--sel-text)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:20;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:11px 20px;border-radius:20px;font-size:14px;font-weight:600;background:var(--sheet);border:.5px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:opacity .22s,transform .22s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Aurora: moving color field behind frosted glass (same as the apps) */
.field,.veil{display:none}
[data-theme="aurora"] .field{display:block;position:fixed;inset:-25%;z-index:0;filter:blur(58px) saturate(150%)}
[data-theme="aurora"] .veil{display:block;position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,rgba(0,0,0,.18),rgba(0,0,0,.6))}
.blob{position:absolute;border-radius:50%;mix-blend-mode:screen}
.b1{width:74vw;height:74vw;background:#6A3CE0;top:2%;left:-12%;animation:d1 26s ease-in-out infinite}
.b2{width:66vw;height:66vw;background:#1E9BE0;top:32%;right:-16%;animation:d2 31s ease-in-out infinite}
.b3{width:58vw;height:58vw;background:#E0603C;bottom:2%;left:8%;animation:d3 24s ease-in-out infinite}
.b4{width:50vw;height:50vw;background:#17B79A;bottom:20%;right:6%;animation:d1 35s ease-in-out infinite reverse}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14%,10%) scale(1.16)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-16%,-9%) scale(.9)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(11%,-13%) scale(1.2)}}
[data-theme="aurora"] .round,[data-theme="aurora"] .apps{
  position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:.5px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.1),0 6px 22px rgba(0,0,0,.22);
}
[data-theme="aurora"] .photo{box-shadow:0 6px 22px rgba(0,0,0,.3);outline:.5px solid rgba(255,255,255,.3)}
[data-theme="aurora"] .app{text-shadow:0 1px 6px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 2px 10px;font-weight:600}
a{color:inherit;text-decoration:none}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px 6px;padding:18px 8px 14px;
  background:var(--tile);border:.5px solid var(--tile-line);box-shadow:var(--tile-shadow);border-radius:20px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .15s ease}
.app:hover{transform:translateY(-3px)}
.app:active{transform:scale(.94)}
.app img{width:64px;height:64px;border-radius:15px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.12);transition:box-shadow .15s}
.app:hover img{box-shadow:0 2px 4px rgba(0,0,0,.14),0 10px 22px rgba(0,0,0,.18)}
.app span{font-weight:600;font-size:13px;letter-spacing:-.01em}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.photo{
  display:block;padding:0;border:.5px solid var(--tile-line);cursor:zoom-in;background:var(--tile);
  border-radius:20px;overflow:hidden;aspect-ratio:3/2;width:100%;box-shadow:var(--tile-shadow);
}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transition:transform .3s ease}
.photo:hover img{transform:scale(1.03)}
.caption{margin:6px 4px 0;color:var(--muted);font-size:14px;font-weight:600}

dialog{
  border:0;padding:0;margin:0;width:100vw;height:100dvh;max-width:none;max-height:none;
  background:#000;color:#fff;
}
dialog::backdrop{background:transparent}
.viewer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 12px 64px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.bar.top{top:env(safe-area-inset-top)} .bar.bottom{bottom:env(safe-area-inset-bottom);justify-content:center}
.btn{
  background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;
  min-width:44px;height:44px;padding:0 16px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center
}
.btn:hover{background:rgba(255,255,255,.22)}
.nav{position:absolute;top:50%;transform:translateY(-50%)}
.nav.prev{left:12px} .nav.next{right:12px}
@media (max-width:600px){.nav{display:none}}
</style>
</head>
<body>
<div class="field"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="veil"></div>
<main>
  <header>
    <h1><img src="favicon.svg" alt="" width="36" height="36">dorrance.me</h1>
    <div class="menu-wrap">
      <button class="round" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="menu" id="menu" hidden>
        <div class="menu-label" id="themeLabel" data-theme-label>Theme</div>
        <div class="seg" id="theme" role="group" aria-label="Theme">
          <button data-t="auto">Auto</button><button data-t="light">Day</button><button data-t="dark">Night</button><button data-t="aurora" hidden>Aurora</button>
        </div>
      </div>
    </div>
  </header>

  <h2>Apps</h2>
  <div class="apps">
    <a class="app" href="calculator/"><img src="calculator/icon-180.png" alt="" width="66" height="66"><span>Calculator</span></a>
    <a class="app" href="counter/"><img src="counter/icon-180.png" alt="" width="66" height="66"><span>Counter</span></a>
    <a class="app" href="converter/"><img src="converter/icon-180.png" alt="" width="66" height="66"><span>Converter</span></a>
    <a class="app" href="triangle/"><img src="triangle/icon-180.png" alt="" width="66" height="66"><span>Triangle</span></a>
    <a class="app" href="tvmount/"><img src="tvmount/icon-180.png" alt="" width="66" height="66"><span>TV Mount</span></a>
  </div>

  <h2>Photos</h2>
  <div class="photos">
    <figure style="margin:0">
      <button class="photo" data-full="photos/wife.jpg" data-orig="DSCF0170.jpg" data-title="My wife">
        <img src="photos/wife-thumb.jpg" alt="My wife" loading="lazy">
      </button>
      <figcaption class="caption">My wife</figcaption>
    </figure>
    <figure style="margin:0">
      <button class="photo" data-full="mycat.jpeg" data-orig="mycat.jpeg" data-title="Billie, my cat">
        <img src="photos/cat-thumb.jpg" alt="Billie, my cat" loading="lazy">
      </button>
      <figcaption class="caption">Billie, my cat</figcaption>
    </figure>
  </div>
</main>

<dialog id="viewer" aria-label="Photo viewer">
  <div class="viewer"><img id="viewer-img" alt=""></div>
  <div class="bar top">
    <span id="viewer-title"></span>
    <button class="btn" id="close" aria-label="Close">✕</button>
  </div>
  <button class="btn nav prev" id="prev" aria-label="Previous">‹</button>
  <button class="btn nav next" id="next" aria-label="Next">›</button>
  <div class="bar bottom"><a class="btn" id="orig" target="_blank" rel="noopener">Full resolution</a></div>
</dialog>

<script>
const root=document.documentElement, meta=document.querySelectorAll('meta[name="theme-color"]');
function setTheme(t){
  if(t==='auto')delete root.dataset.theme; else root.dataset.theme=t;
  try{localStorage.setItem('theme',t)}catch(e){}
  document.querySelectorAll('#theme button').forEach(b=>{b.classList.toggle('on',b.dataset.t===t);if(b.dataset.t==='aurora')b.hidden=t!=='aurora'});
  const bg=getComputedStyle(document.body).backgroundColor;
  meta.forEach(m=>m.content=t==='auto'?(m.media.includes('dark')?'#141517':'#F4F4F5'):bg);
}
// Aurora is secret: five taps on the Theme label within 2 seconds turn it on.
let taps=[],toastEl,toastT;
function toast(msg){
  if(!toastEl){toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl)}
  toastEl.textContent=msg;toastEl.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),1900);
}
document.getElementById('themeLabel').addEventListener('click',()=>{
  const now=Date.now();taps=taps.filter(x=>now-x<2000).concat(now);
  if(taps.length<5)return;
  taps=[];setTheme('aurora');toast('Aurora');
});
document.getElementById('theme').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)});
setTheme(root.dataset.theme||'auto');

const burger=document.getElementById('burger'), menu=document.getElementById('menu');
function openMenu(o){menu.hidden=!o;burger.setAttribute('aria-expanded',o)}
burger.addEventListener('click',()=>openMenu(menu.hidden));
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.menu-wrap'))openMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(false)});

const photos=[...document.querySelectorAll('.photo')];
const dlg=document.getElementById('viewer'), img=document.getElementById('viewer-img');
let i=0;
function show(n){
  i=(n+photos.length)%photos.length;
  const p=photos[i].dataset;
  img.src=p.full; img.alt=p.title;
  document.getElementById('viewer-title').textContent=p.title;
  document.getElementById('orig').href=p.orig;
}
photos.forEach((b,n)=>b.addEventListener('click',()=>{show(n);dlg.showModal()}));
document.getElementById('close').onclick=()=>dlg.close();
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
dlg.addEventListener('click',e=>{if(e.target.classList.contains('viewer'))dlg.close()});
dlg.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')show(i-1);
  if(e.key==='ArrowRight')show(i+1);
});
let x0=null;
dlg.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
dlg.addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>50)show(dx<0?i+1:i-1);
});
</script>
</body>
</html>
