<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dorrance.me</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>
try{const t=localStorage.getItem('theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
:root{
  --bg:#f2f3f5; --surface:#fff; --text:#16181b; --muted:#6c717a; --line:#dfe2e6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--surface:#17191d;--text:#f2f3f5;--muted:#8d929b;--line:#2a2d33;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--surface:#17191d;--text:#f2f3f5;--muted:#8d929b;--line:#2a2d33;color-scheme:dark}
:root[data-theme="aurora"]{--bg:#0E0A1E;--surface:rgba(255,255,255,.11);--text:#fff;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.28);color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:max(24px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
main{max-width:880px;margin:0 auto;position:relative;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 28px;position:relative;z-index:5}
.menu-wrap{position:relative}
.burger{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--text)}
.menu{position:absolute;right:0;top:52px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);animation:pop .15s ease-out}
.menu-label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
h1{font-size:28px;margin:0;letter-spacing:-.02em}

.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Aurora: moving color field behind frosted glass (same as Counter) */
.field,.veil{display:none}
[data-theme="aurora"] .field{display:block;position:fixed;inset:-25%;z-index:0;filter:blur(58px) saturate(150%)}
[data-theme="aurora"] .veil{display:block;position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,rgba(0,0,0,.18),rgba(0,0,0,.6))}
.blob{position:absolute;border-radius:50%;mix-blend-mode:screen}
.b1{width:74vw;height:74vw;background:#6A3CE0;top:2%;left:-12%;animation:d1 26s ease-in-out infinite}
.b2{width:66vw;height:66vw;background:#1E9BE0;top:32%;right:-16%;animation:d2 31s ease-in-out infinite}
.b3{width:58vw;height:58vw;background:#E0603C;bottom:2%;left:8%;animation:d3 24s ease-in-out infinite}
.b4{width:50vw;height:50vw;background:#17B79A;bottom:20%;right:6%;animation:d1 35s ease-in-out infinite reverse}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14%,10%) scale(1.16)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-16%,-9%) scale(.9)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(11%,-13%) scale(1.2)}}
[data-theme="aurora"] .app,
[data-theme="aurora"] .burger{
  position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:.5px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.1),0 6px 22px rgba(0,0,0,.22);
}
[data-theme="aurora"] .menu{background:rgba(20,14,42,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:.5px solid rgba(255,255,255,.22)}
[data-theme="aurora"] .seg{background:rgba(255,255,255,.08)}
[data-theme="aurora"] .seg button.on{background:rgba(255,255,255,.22);box-shadow:none}
[data-theme="aurora"] .app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.05) 34%,transparent 60%)}
[data-theme="aurora"] .photo{box-shadow:0 6px 22px rgba(0,0,0,.3);outline:.5px solid rgba(255,255,255,.3)}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:32px 0 12px;font-weight:600}
a{color:inherit;text-decoration:none}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.app{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.app:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.app img{width:44px;height:44px;border-radius:11px;flex:none}
.app span{font-weight:600}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.photo{
  display:block;padding:0;border:0;cursor:zoom-in;background:var(--surface);
  border-radius:16px;overflow:hidden;aspect-ratio:3/2;width:100%;
}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transition:transform .3s ease}
.photo:hover img{transform:scale(1.03)}
.caption{margin:6px 4px 0;color:var(--muted);font-size:14px}

dialog{
  border:0;padding:0;margin:0;width:100vw;height:100dvh;max-width:none;max-height:none;
  background:#000;color:#fff;
}
dialog::backdrop{background:transparent}
.viewer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 12px 64px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.bar.top{top:env(safe-area-inset-top)} .bar.bottom{bottom:env(safe-area-inset-bottom);justify-content:center}
.btn{
  background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;
  min-width:44px;height:44px;padding:0 16px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center
}
.btn:hover{background:rgba(255,255,255,.22)}
.nav{position:absolute;top:50%;transform:translateY(-50%)}
.nav.prev{left:12px} .nav.next{right:12px}
@media (max-width:600px){.nav{display:none}}
</style>
</head>
<body>
<div class="field"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="veil"></div>
<main>
  <header>
    <h1>dorrance.me</h1>
    <div class="menu-wrap">
      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
      <div class="menu" id="menu" hidden>
        <div class="menu-label">Theme</div>
        <div class="seg" id="theme" role="group" aria-label="Theme">
          <button data-t="auto">Auto</button><button data-t="light">Day</button><button data-t="dark">Night</button><button data-t="aurora">Aurora</button>
        </div>
      </div>
    </div>
  </header>

  <h2>Apps</h2>
  <div class="apps">
    <a class="app" href="calculator/"><img src="calculator/icon.png" alt=""><span>Calculator</span></a>
    <a class="app" href="counter/"><img src="counter/icon-180.png" alt=""><span>Counter</span></a>
  </div>

  <h2>Photos</h2>
  <div class="photos">
    <figure style="margin:0">
      <button class="photo" data-full="photos/wife.jpg" data-orig="DSCF0170.jpg" data-title="My wife">
        <img src="photos/wife-thumb.jpg" alt="My wife" loading="lazy">
      </button>
      <figcaption class="caption">My wife</figcaption>
    </figure>
    <figure style="margin:0">
      <button class="photo" data-full="mycat.jpeg" data-orig="mycat.jpeg" data-title="Billie, my cat">
        <img src="photos/cat-thumb.jpg" alt="Billie, my cat" loading="lazy">
      </button>
      <figcaption class="caption">Billie, my cat</figcaption>
    </figure>
  </div>
</main>

<dialog id="viewer" aria-label="Photo viewer">
  <div class="viewer"><img id="viewer-img" alt=""></div>
  <div class="bar top">
    <span id="viewer-title"></span>
    <button class="btn" id="close" aria-label="Close">✕</button>
  </div>
  <button class="btn nav prev" id="prev" aria-label="Previous">‹</button>
  <button class="btn nav next" id="next" aria-label="Next">›</button>
  <div class="bar bottom"><a class="btn" id="orig" target="_blank" rel="noopener">Full resolution</a></div>
</dialog>

<script>
const root=document.documentElement, meta=document.querySelectorAll('meta[name="theme-color"]');
function setTheme(t){
  if(t==='auto')delete root.dataset.theme; else root.dataset.theme=t;
  try{localStorage.setItem('theme',t)}catch(e){}
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const bg=getComputedStyle(document.body).backgroundColor;
  meta.forEach(m=>m.content=t==='auto'?(m.media.includes('dark')?'#000000':'#f2f3f5'):bg);
}
document.getElementById('theme').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)});
setTheme(root.dataset.theme||'auto');

const burger=document.getElementById('burger'), menu=document.getElementById('menu');
function openMenu(o){menu.hidden=!o;burger.setAttribute('aria-expanded',o)}
burger.addEventListener('click',()=>openMenu(menu.hidden));
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.menu-wrap'))openMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(false)});

const photos=[...document.querySelectorAll('.photo')];
const dlg=document.getElementById('viewer'), img=document.getElementById('viewer-img');
let i=0;
function show(n){
  i=(n+photos.length)%photos.length;
  const p=photos[i].dataset;
  img.src=p.full; img.alt=p.title;
  document.getElementById('viewer-title').textContent=p.title;
  document.getElementById('orig').href=p.orig;
}
photos.forEach((b,n)=>b.addEventListener('click',()=>{show(n);dlg.showModal()}));
document.getElementById('close').onclick=()=>dlg.close();
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
dlg.addEventListener('click',e=>{if(e.target.classList.contains('viewer'))dlg.close()});
dlg.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')show(i-1);
  if(e.key==='ArrowRight')show(i+1);
});
let x0=null;
dlg.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
dlg.addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>50)show(dx<0?i+1:i-1);
});
</script>
</body>
</html>
