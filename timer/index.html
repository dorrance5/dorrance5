<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="Countdown timer and stopwatch with laps. Keeps running if you reload. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/base.css">
<title>Timer</title>
<style>
.tabs{margin:4px 0 18px}
.big{font-size:clamp(56px,19vw,96px);font-weight:300;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:28px 0 8px}
.big small{font-size:.42em;color:var(--muted);font-weight:400}
.big.done{color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin:18px 0 22px}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:4px;transition:width .25s linear}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.ctl button{height:64px;border-radius:20px;font-size:20px}
.ctl .go{background:var(--green);border-color:transparent;color:#fff}
:root[data-mode="dark"] .ctl .go{background:rgba(31,157,85,.25);color:#5BD48A;border-color:rgba(91,212,138,.4)}
.ctl .stop{background:var(--red);border-color:transparent;color:#fff}
:root[data-mode="dark"] .ctl .stop{background:rgba(208,42,42,.25);color:#FF8080;border-color:rgba(255,128,128,.4)}
:root[data-mode="aurora"] .ctl .go{background:rgba(31,157,85,.6);color:#fff;border-color:rgba(255,255,255,.3)}
:root[data-mode="aurora"] .ctl .stop{background:rgba(208,42,42,.6);color:#fff;border-color:rgba(255,255,255,.3)}
.laps{margin-top:8px}
.lap{display:grid;grid-template-columns:52px 1fr 1fr;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:17px}
.lap:last-child{border-bottom:0}
.lap .n{color:var(--muted);font-weight:600}
.lap .t{text-align:right;color:var(--muted)}
.lap.fast .d{color:var(--green);font-weight:650}
.lap.slow .d{color:var(--red);font-weight:650}
.chips{justify-content:center}
.num3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.num3 label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;text-align:center}
.num3 input{text-align:center;font-size:26px;height:60px}
.hint{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
</style>
</head>
<body>
<header>
  <a class="round" href="../" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
  <h1>Timer</h1>
  <span class="sp"></span>
  <button class="round" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main>
  <div class="seg tabs" id="tabs"><button data-tab="timer">Timer</button><button data-tab="watch">Stopwatch</button></div>

  <section id="timer">
    <div class="big" id="tBig">05:00</div>
    <div class="bar"><i id="tBar"></i></div>
    <div class="chips" id="presets"></div>
    <div class="ctl">
      <button class="btn" id="tReset">Reset</button>
      <button class="primary go" id="tGo">Start</button>
    </div>
    <p class="hint" id="tHint"></p>
  </section>

  <section id="watch" hidden>
    <div class="big" id="wBig">00:00<small>.00</small></div>
    <div class="ctl">
      <button class="btn" id="wLap">Lap</button>
      <button class="primary go" id="wGo">Start</button>
    </div>
    <div class="card laps" id="laps" hidden></div>
  </section>
</main>

<script src="../shared/base.js"></script>
<script>
const { $, esc, load, save, buzz, sheet, closeSheet, toast, themeSegHTML } = App;
App.init();

const KEY = 'timer-v1';
const S = Object.assign({ tab: 'timer',
  t: { dur: 300000, left: 300000, endAt: null, done: false },      // countdown
  w: { acc: 0, startAt: null, laps: [] },                           // stopwatch
  presets: [60, 180, 300, 600, 900, 1200, 1800, 2700, 3600], sound: true }, load(KEY, {}));
const persist = () => save(KEY, S);

const pad = n => String(n).padStart(2, '0');
function fmtT(ms) {           // countdown: h:mm:ss or mm:ss
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function fmtW(ms) {           // stopwatch: [h:]mm:ss.cc
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return `${h ? h + ':' : ''}${pad(m)}:${pad(sec)}<small>.${pad(cs)}</small>`;
}
function fmtPreset(sec) { return sec % 3600 === 0 ? sec / 3600 + ' h' : sec % 60 === 0 ? sec / 60 + ' min' : sec + ' s'; }

/* ---- tabs ---- */
function showTab(t) {
  S.tab = t; persist();
  $('#timer').hidden = t !== 'timer'; $('#watch').hidden = t !== 'watch';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });

/* ---- sound + wake lock ---- */
let ac, lock;
function beep(times = 3) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    for (let i = 0; i < times; i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0, ac.currentTime + i * .32);
      g.gain.linearRampToValueAtTime(.5, ac.currentTime + i * .32 + .02);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + i * .32 + .25);
      o.connect(g).connect(ac.destination);
      o.start(ac.currentTime + i * .32); o.stop(ac.currentTime + i * .32 + .3);
    }
  } catch (e) {}
}
function primeAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} }
async function keepAwake(on) {
  try {
    if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && (S.t.endAt || S.w.startAt)) keepAwake(true); });

/* ---- countdown ---- */
let alarmT = 0;
function tLeft() { return S.t.endAt ? S.t.endAt - Date.now() : S.t.left; }
function paintT() {
  const left = tLeft(), running = !!S.t.endAt;
  $('#tBig').innerHTML = fmtT(left);
  $('#tBig').classList.toggle('done', S.t.done);
  $('#tBar').style.width = (S.t.dur ? Math.min(100, Math.max(0, 100 - left / S.t.dur * 100)) : 0) + '%';
  const go = $('#tGo');
  go.textContent = running ? 'Pause' : (left < S.t.dur && left > 0 ? 'Resume' : 'Start');
  go.className = 'primary ' + (running ? 'stop' : 'go');
  $('#tHint').textContent = running ? 'Ends at ' + new Date(S.t.endAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  if (running && left <= 0) finishT();
  document.title = running ? fmtT(left) + ' · Timer' : 'Timer';
}
function finishT() {
  S.t.endAt = null; S.t.left = 0; S.t.done = true; persist();
  keepAwake(false); buzz([200, 100, 200, 100, 400]); beep(3);
  let n = 0; clearInterval(alarmT);
  alarmT = setInterval(() => { buzz([200, 100, 200]); beep(3); if (++n > 20) clearInterval(alarmT); }, 2000);
  const el = sheet(`<h2>Time's up</h2><p style="color:var(--muted);margin:0 0 16px">${fmtPreset(S.t.dur / 1000)} is done.</p>
    <div class="actions"><button class="btn" data-act="more">+1 min</button><span class="sp"></span><button class="primary" data-act="ok">Dismiss</button></div>`);
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-act]')?.dataset.act;
    if (!a) return;
    clearInterval(alarmT);
    if (a === 'more') { S.t.dur = 60000; S.t.left = 60000; S.t.done = false; startT(); }
    else { S.t.left = S.t.dur; S.t.done = false; persist(); }
    closeSheet(); paintT();
  });
  if (Notification.permission === 'granted' && document.hidden) {
    try { new Notification("Time's up", { body: fmtPreset(S.t.dur / 1000) + ' is done', tag: 'timer' }); } catch (e) {}
  }
}
function startT() {
  primeAudio();
  if (S.t.left <= 0) S.t.left = S.t.dur;
  S.t.endAt = Date.now() + S.t.left; S.t.done = false; persist();
  keepAwake(true); paintT();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}
function pauseT() { S.t.left = Math.max(0, tLeft()); S.t.endAt = null; persist(); keepAwake(false); paintT(); }
function setDur(ms) { clearInterval(alarmT); S.t.dur = ms; S.t.left = ms; S.t.endAt = null; S.t.done = false; persist(); keepAwake(false); paintT(); paintPresets(); }

$('#tGo').onclick = () => { buzz(10); S.t.endAt ? pauseT() : startT(); };
$('#tReset').onclick = () => { buzz(10); clearInterval(alarmT); closeSheet(); setDur(S.t.dur); };

function paintPresets() {
  $('#presets').innerHTML = S.presets.map(s =>
    `<button class="chip${S.t.dur === s * 1000 ? ' on' : ''}" data-s="${s}">${fmtPreset(s)}</button>`).join('') +
    `<button class="chip" data-s="custom">Custom…</button>`;
}
$('#presets').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  buzz(8);
  if (b.dataset.s !== 'custom') return setDur(+b.dataset.s * 1000);
  const cur = S.t.dur / 1000;
  const el = sheet(`<h2>Custom time</h2>
    <div class="num3">
      <div><label>Hours</label><input class="input" id="ch" type="number" inputmode="numeric" min="0" max="99" value="${Math.floor(cur / 3600)}"></div>
      <div><label>Minutes</label><input class="input" id="cm" type="number" inputmode="numeric" min="0" max="59" value="${Math.floor(cur % 3600 / 60)}"></div>
      <div><label>Seconds</label><input class="input" id="cs" type="number" inputmode="numeric" min="0" max="59" value="${cur % 60}"></div>
    </div>
    <div class="actions"><button class="btn" data-act="pin">Save as preset</button><span class="sp"></span><button class="primary" data-act="ok">Set</button></div>`, 'top');
  const total = () => ((+el.querySelector('#ch').value || 0) * 3600 + (+el.querySelector('#cm').value || 0) * 60 + (+el.querySelector('#cs').value || 0));
  el.querySelector('#cm').focus(); el.querySelector('#cm').select();
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
    const s = total(); if (!s) { toast('Enter a time'); return; }
    if (a === 'pin' && !S.presets.includes(s)) { S.presets.push(s); S.presets.sort((x, y) => x - y); }
    closeSheet(); setDur(s * 1000);
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.querySelector('[data-act="ok"]').click(); });
});

/* ---- stopwatch ---- */
function wElapsed() { return S.w.acc + (S.w.startAt ? Date.now() - S.w.startAt : 0); }
function paintW() {
  const running = !!S.w.startAt, ms = wElapsed();
  $('#wBig').innerHTML = fmtW(ms);
  const go = $('#wGo'), lap = $('#wLap');
  go.textContent = running ? 'Stop' : (ms ? 'Resume' : 'Start');
  go.className = 'primary ' + (running ? 'stop' : 'go');
  lap.textContent = running ? 'Lap' : 'Reset';
  lap.disabled = !running && !ms;
}
function paintLaps() {
  const L = S.w.laps, box = $('#laps');
  box.hidden = !L.length;
  if (!L.length) return;
  const d = L.map((t, i) => t - (L[i - 1] || 0));
  const fast = d.indexOf(Math.min(...d)), slow = d.indexOf(Math.max(...d));
  box.innerHTML = L.map((t, i) => `<div class="lap${L.length > 1 && i === fast ? ' fast' : ''}${L.length > 1 && i === slow ? ' slow' : ''}">
    <span class="n">${i + 1}</span><span class="d">${fmtW(d[i])}</span><span class="t">${fmtW(t)}</span></div>`).reverse().join('');
}
$('#wGo').onclick = () => {
  buzz(10);
  if (S.w.startAt) { S.w.acc = wElapsed(); S.w.startAt = null; keepAwake(false); }
  else { S.w.startAt = Date.now(); keepAwake(true); }
  persist(); paintW();
};
$('#wLap').onclick = () => {
  buzz(10);
  if (S.w.startAt) S.w.laps.push(wElapsed());
  else { S.w.acc = 0; S.w.laps = []; }
  persist(); paintW(); paintLaps();
};

/* ---- settings ---- */
$('#setBtn').onclick = () => {
  const el = sheet(`<h2>Settings</h2>${themeSegHTML()}
    <div class="label">Alarm</div>
    <button class="opt" data-act="sound">Sound<span class="check">${S.sound ? '✓' : ''}</span></button>
    <button class="opt" data-act="notify">Notifications<span class="check">${'Notification' in window ? (Notification.permission === 'granted' ? '✓' : Notification.permission === 'denied' ? 'Blocked' : '') : 'n/a'}</span></button>
    <div class="label">Presets</div>
    <div class="stack"><button class="btn" data-act="presets">Reset presets</button></div>`);
  el.addEventListener('click', async e => {
    const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
    if (a === 'sound') { S.sound = !S.sound; persist(); e.target.closest('.opt').querySelector('.check').textContent = S.sound ? '✓' : ''; if (S.sound) beep(1); }
    if (a === 'notify' && 'Notification' in window) { const p = await Notification.requestPermission(); e.target.closest('.opt').querySelector('.check').textContent = p === 'granted' ? '✓' : p === 'denied' ? 'Blocked' : ''; }
    if (a === 'presets') { S.presets = [60, 180, 300, 600, 900, 1200, 1800, 2700, 3600]; persist(); paintPresets(); toast('Presets reset'); }
  });
};

/* ---- loop ---- */
function tick() {
  if (S.t.endAt) paintT();
  if (S.w.startAt) paintW();
  requestAnimationFrame(tick);
}
showTab(S.tab); paintPresets(); paintT(); paintW(); paintLaps();
if (S.t.endAt || S.w.startAt) keepAwake(true);
requestAnimationFrame(tick);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); (S.tab === 'timer' ? $('#tGo') : $('#wGo')).click(); }
  if (e.key === 'l' || e.key === 'L') { if (S.tab === 'watch') $('#wLap').click(); }
});
</script>
</body>
</html>
