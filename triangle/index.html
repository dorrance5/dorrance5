<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Triangle">
<meta name="theme-color" content="#F4F4F5">
<meta name="description" content="Triangle solver: enter any three values (at least one side) and get the rest, with a scale drawing, area and heights. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/base.css">
<title>Triangle</title>
<style>
.draw{padding:10px;margin-bottom:10px}
.draw svg{width:100%;height:auto;display:block}
.draw .fill{fill:url(#tg)}
.draw .s1{stop-color:var(--orange-bg)}
.draw .s2{stop-color:var(--teal-bg)}
.draw .side{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round}
.draw .arc{fill:none;stroke:var(--teal);stroke-width:2}
.draw .lbl{font-family:var(--ui);font-size:13px;fill:var(--orange);font-weight:650;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--tile);stroke-width:3px;stroke-linejoin:round}
.draw .lbl.ang{fill:var(--teal)}
.draw .v{fill:var(--text)}
.draw .msg{font-family:var(--ui);font-size:12px;font-weight:600;fill:var(--muted)}
.draw .lbl.ex{font-size:17px;font-weight:700}
.fld.solved{background:var(--hbg);border-color:transparent;animation:pop .22s ease-out}
.fld.solved .fv,.fld.solved .fk{color:var(--hc)}
.fld.bad{border-color:var(--red)}
@keyframes pop{from{transform:scale(.96);opacity:.5}}
.note{text-align:center;color:var(--muted);font-size:14px;margin:0 4px 10px;min-height:20px}
.note.err{color:var(--red);font-weight:600}
.alt{margin:0 0 10px}
.btns{display:flex;gap:8px;margin-bottom:10px}
.btns .btn{flex:1;height:42px;font-size:15px}
.tri .s{white-space:nowrap}
[data-mode="aurora"] .fact{-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
</style>
</head>
<body>
<header>
  <h1>Triangle</h1>
  <span class="sp"></span>
  <button class="round" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main>
  <div class="card draw"><svg id="svg" viewBox="0 0 360 240" aria-label="Triangle drawing"></svg></div>

  <section class="card sec hue-orange">
    <div class="sec-h"><span class="ic orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 12 5l8 14z"/><path d="M8 12.2 6.2 11.2M16 12.2l1.8-1M12 19v2"/></svg></span><span>Sides</span></div>
    <div class="sec-b"><div class="grid3"><label class="fld"><span class="fk">a</span><input class="fv" id="a" inputmode="decimal" autocomplete="off"></label><label class="fld"><span class="fk">b</span><input class="fv" id="b" inputmode="decimal" autocomplete="off"></label><label class="fld"><span class="fk">c</span><input class="fv" id="c" inputmode="decimal" autocomplete="off"></label></div></div>
  </section>
  <section class="card sec hue-teal">
    <div class="sec-h"><span class="ic teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M4 19 16 6"/><path d="M10 19a6 6 0 0 0-1.8-4.4"/></svg></span><span>Angles, in degrees</span></div>
    <div class="sec-b"><div class="grid3"><label class="fld"><span class="fk">A</span><input class="fv" id="A" inputmode="decimal" autocomplete="off"></label><label class="fld"><span class="fk">B</span><input class="fv" id="B" inputmode="decimal" autocomplete="off"></label><label class="fld"><span class="fk">C</span><input class="fv" id="C" inputmode="decimal" autocomplete="off"></label></div></div>
  </section>
  <div class="note" id="note"></div>
  <div class="seg alt" id="alt" hidden><button class="on" data-sol="0">Solution 1</button><button data-sol="1">Solution 2</button></div>
  <div class="btns"><button class="btn" id="right">C = 90°</button><button class="btn" id="clear">Clear</button></div>

  <div id="facts"></div>
</main>

<script src="../shared/base.js"></script>
<script>
const { $, esc, load, save, buzz, sheet, toast, copy, themeSegHTML, homeLinkHTML } = App;
App.init();

const KEY = 'triangle-v1';
const S = Object.assign({ v: { a: '', b: '', c: '', A: '', B: '', C: '' }, frac: false, prec: 16 }, load(KEY, {}));
const persist = () => save(KEY, S);
const KEYS = ['a', 'b', 'c', 'A', 'B', 'C'];
const D = Math.PI / 180;
let which = 0;

/* ---- parsing / formatting ---- */
function parseFrac(s) {                   // "3", "3.5", "1/2", "3 1/2", "5' 3 1/2\"" (feet-inches to inches)
  s = String(s).trim().replace(/[”″]/g, '"').replace(/[’′]/g, "'");
  if (!s) return NaN;
  const ft = s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft)\s*(.*)$/i);
  if (ft) { const r = ft[2].replace(/(in|")\s*$/i, '').trim(); const i = r ? parseFrac(r) : 0; return (+ft[1]) * 12 + (isNaN(i) ? 0 : i); }
  s = s.replace(/(in|")\s*$/i, '').trim();
  const m = s.match(/^(\d+(?:\.\d+)?)?\s*(?:(\d+)\s*\/\s*(\d+))?$/);
  if (!m || (m[1] == null && m[2] == null)) return parseFloat(s);
  return (m[1] ? +m[1] : 0) + (m[2] ? (+m[2]) / (+m[3] || 1) : 0);
}
function fmt(x) {
  if (!isFinite(x)) return '–';
  const s = Number(x.toPrecision(6)).toString();
  return s.includes('e') ? s : s;
}
function frac(x, den) {
  let n = Math.round(x * den), w = Math.floor(n / den); n -= w * den;
  let g = n, d = den; while (g && d % g) { const t = d % g; d = g; g = t; }
  if (n) { n /= g; d = den / g; }
  return n ? (w ? w + ' ' : '') + n + '/' + d : String(w);
}
const side = x => fmt(x) + (S.frac ? ' ≈ ' + frac(x, S.prec) : '');
const ang = x => fmt(x) + '°';

/* ---- solver: returns {sols:[{a,b,c,A,B,C}], err} ---- */
function solve(k) {
  const given = KEYS.filter(x => isFinite(k[x]));
  const sides = given.filter(x => x === x.toLowerCase()), angs = given.filter(x => x !== x.toLowerCase());
  if (given.length < 3) return { err: 'Enter three values, including at least one side.' };
  if (given.length > 3) return { err: 'Enter exactly three values. Clear one to continue.' };
  if (!sides.length) return { err: 'At least one side is needed to fix the size.' };
  if (sides.some(x => k[x] <= 0)) return { err: 'Sides must be positive.' };
  if (angs.some(x => k[x] <= 0 || k[x] >= 180)) return { err: 'Angles must be between 0 and 180.' };
  if (angs.length === 2 && k[angs[0]] + k[angs[1]] >= 180) return { err: 'Two angles must add up to less than 180.' };
  const t = { ...k };
  const cos = (p, q, r) => Math.acos(Math.max(-1, Math.min(1, (p * p + q * q - r * r) / (2 * p * q)))) / D;

  if (sides.length === 3) {                                 // SSS
    const { a, b, c } = t;
    if (a + b <= c || a + c <= b || b + c <= a) return { err: 'Those sides can\'t form a triangle (one is longer than the other two together).' };
    t.A = cos(b, c, a); t.B = cos(a, c, b); t.C = 180 - t.A - t.B;
    return { sols: [t] };
  }
  if (angs.length === 2) {                                  // ASA / AAS
    const third = ['A', 'B', 'C'].find(x => !angs.includes(x));
    t[third] = 180 - t[angs[0]] - t[angs[1]];
    const s = sides[0], r = t[s] / Math.sin(t[s.toUpperCase()] * D);
    for (const x of ['a', 'b', 'c']) if (x !== s) t[x] = r * Math.sin(t[x.toUpperCase()] * D);
    return { sols: [t] };
  }
  // two sides, one angle
  const missing = ['a', 'b', 'c'].find(x => !sides.includes(x)), ang1 = angs[0];
  if (ang1.toLowerCase() === missing) {                     // SAS
    const [p, q] = sides.map(x => t[x]);
    t[missing] = Math.sqrt(p * p + q * q - 2 * p * q * Math.cos(t[ang1] * D));
    const others = ['A', 'B', 'C'].filter(x => x !== ang1);
    t[others[0]] = cos(t[others[1].toLowerCase()], t[missing], t[others[0].toLowerCase()]);
    t[others[1]] = 180 - t[ang1] - t[others[0]];
    return { sols: [t] };
  }
  // SSA: angle opposite one of the known sides
  const s1 = ang1.toLowerCase(), s2 = sides.find(x => x !== s1), A2 = s2.toUpperCase();
  const sinB = t[s2] * Math.sin(t[ang1] * D) / t[s1];
  if (sinB > 1 + 1e-12) return { err: `No triangle: side ${s2} is too short to reach side ${s1}'s far end at angle ${ang1}.` };
  const B1 = Math.asin(Math.min(1, sinB)) / D, cands = [B1, 180 - B1].filter((x, i) => i === 0 || (x > 0 && Math.abs(x - B1) > 1e-9));
  const sols = [];
  for (const Bx of cands) {
    const Cx = 180 - t[ang1] - Bx;
    if (Cx <= 1e-9) continue;
    const u = { ...t }; u[A2] = Bx;
    const third = ['A', 'B', 'C'].find(x => x !== ang1 && x !== A2);
    u[third] = Cx; u[third.toLowerCase()] = t[s1] * Math.sin(Cx * D) / Math.sin(t[ang1] * D);
    sols.push(u);
  }
  if (!sols.length) return { err: 'No triangle fits those values.' };
  return { sols, ambiguous: sols.length > 1 };
}

/* ---- drawing ---- */
function draw(t) {
  const svg = $('#svg'), W = 360, H = 240, P = 44;
  // with nothing solved, show a labelled example so the letters are clear
  const ex = !t;
  if (ex) t = solve({ a: 6, b: 5, c: 7, A: NaN, B: NaN, C: NaN }).sols[0];
  // B at origin, C along +x (side a), A above
  const pts = { B: [0, 0], C: [t.a, 0], A: [t.c * Math.cos(t.B * D), t.c * Math.sin(t.B * D)] };
  const xs = Object.values(pts).map(p => p[0]), ys = Object.values(pts).map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min((W - 2 * P) / (maxX - minX || 1), (H - 2 * P) / (maxY - minY || 1));
  const ox = (W - (maxX - minX) * sc) / 2 - minX * sc, oy = (H - (maxY - minY) * sc) / 2 + maxY * sc;
  const X = p => ox + p[0] * sc, Y = p => oy - p[1] * sc;
  const V = {}; for (const k in pts) V[k] = [X(pts[k]), Y(pts[k])];
  const unit = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const anchor = dx => dx > .35 ? 'start' : dx < -.35 ? 'end' : 'middle';
  const text = (cls, x, y, dir, str) => `<text class="lbl ${cls}${ex ? ' ex' : ''}" x="${x}" y="${y + (ex ? 6 : 4)}" text-anchor="${anchor(dir[0])}">${str}</text>`;
  let h = `<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop class="s1" offset="0"/><stop class="s2" offset="1"/></linearGradient></defs>`;
  h += `<polygon class="fill" points="${V.A} ${V.B} ${V.C}"/><polygon class="side" points="${V.A} ${V.B} ${V.C}"/>`;
  // angle arcs
  const opp = { A: ['B', 'C'], B: ['C', 'A'], C: ['A', 'B'] };
  for (const v of ['A', 'B', 'C']) {
    const [p, q] = opp[v].map(x => V[x]), r = Math.min(18, Math.hypot(p[0] - V[v][0], p[1] - V[v][1]) / 3, Math.hypot(q[0] - V[v][0], q[1] - V[v][1]) / 3);
    const a1 = Math.atan2(p[1] - V[v][1], p[0] - V[v][0]), a2 = Math.atan2(q[1] - V[v][1], q[0] - V[v][0]);
    if (Math.abs(t[v] - 90) < 1e-6) {
      const u1 = [Math.cos(a1) * r * .8, Math.sin(a1) * r * .8], u2 = [Math.cos(a2) * r * .8, Math.sin(a2) * r * .8];
      h += `<path class="arc" d="M${V[v][0] + u1[0]},${V[v][1] + u1[1]} l${u2[0]},${u2[1]} l${-u1[0]},${-u1[1]}"/>`;
    } else {
      let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      h += `<path class="arc" d="M${V[v][0] + Math.cos(a1) * r},${V[v][1] + Math.sin(a1) * r} A${r},${r} 0 0 ${d > 0 ? 1 : 0} ${V[v][0] + Math.cos(a2) * r},${V[v][1] + Math.sin(a2) * r}"/>`;
    }
    // label on the outward bisector of the vertex angle
    const u1 = unit(V[v], p), u2 = unit(V[v], q); let bx = -(u1[0] + u2[0]), by = -(u1[1] + u2[1]);
    const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
    h += `<circle class="v" cx="${V[v][0]}" cy="${V[v][1]}" r="3"/>` + text('ang', V[v][0] + bx * 14, V[v][1] + by * 14, [bx, by], ex ? v : `${v} ${fmt(t[v])}°`);
  }
  for (const [s, p, q, o] of [['a', 'B', 'C', 'A'], ['b', 'C', 'A', 'B'], ['c', 'A', 'B', 'C']]) {
    // label on the side's outward normal (away from the opposite vertex)
    const m = [(V[p][0] + V[q][0]) / 2, (V[p][1] + V[q][1]) / 2], u = unit(V[p], V[q]);
    let nx = -u[1], ny = u[0];
    if ((V[o][0] - m[0]) * nx + (V[o][1] - m[1]) * ny > 0) { nx = -nx; ny = -ny; }
    h += text('', m[0] + nx * 12, m[1] + ny * 12, [nx, ny], ex ? s : `${s} = ${fmt(t[s])}`);
  }
  if (ex) h += `<text class="msg" x="10" y="20">Example</text>`;
  svg.innerHTML = h;
}

/* ---- ui ---- */
function kind(t) {
  const [a, b, c] = [t.a, t.b, t.c], eq = (x, y) => Math.abs(x - y) < 1e-9 * Math.max(1, x);
  const sides = eq(a, b) && eq(b, c) ? 'Equilateral' : (eq(a, b) || eq(b, c) || eq(a, c)) ? 'Isosceles' : 'Scalene';
  const mx = Math.max(t.A, t.B, t.C);
  const angs = Math.abs(mx - 90) < 1e-7 ? 'right' : mx > 90 ? 'obtuse' : 'acute';
  return sides + ', ' + angs;
}
function update() {
  const k = {}; const bad = [];
  for (const x of KEYS) { const raw = $('#' + x).value.trim(); S.v[x] = raw; k[x] = raw ? parseFrac(raw) : NaN; if (raw && isNaN(k[x])) bad.push(x); }
  persist();
  KEYS.forEach(x => { $('#' + x).parentElement.classList.toggle('bad', bad.includes(x)); $('#' + x).parentElement.classList.remove('solved'); });
  const r = bad.length ? { err: 'Numbers only. Fractions like 3 1/2 are fine.' } : solve(k);
  const note = $('#note'); note.className = 'note' + (r.err ? ' err' : '');
  $('#alt').hidden = !r.ambiguous;
  if (r.err) { note.textContent = r.err; draw(null); $('#facts').innerHTML = ''; return; }
  if (which >= r.sols.length) which = 0;
  const t = r.sols[which];
  document.querySelectorAll('#alt button').forEach(c => c.classList.toggle('on', +c.dataset.sol === which));
  note.textContent = r.ambiguous ? 'Two triangles fit these values.' : kind(t);
  for (const x of KEYS) if (!isFinite(k[x])) { $('#' + x).value = x === x.toLowerCase() ? fmt(t[x]) : fmt(t[x]); $('#' + x).parentElement.classList.add('solved'); }
  draw(t);
  const s = (t.a + t.b + t.c) / 2, area = Math.sqrt(Math.max(0, s * (s - t.a) * (s - t.b) * (s - t.c)));
  const li = (k, v, hue) => `<div class="li${hue ? ' h-' + hue : ''}"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;
  $('#facts').innerHTML = `<div class="hero"><div class="k">Area</div><div class="v">${esc(fmt(area))}</div><div class="s">${esc(kind(t))}</div></div>
    <div class="tri">${['a', 'b', 'c'].map(x => { const v = 2 * area / t[x]; return `<div class="fact"><div class="k">Height to ${x}</div><div class="v">${esc(fmt(v))}</div>${S.frac ? `<div class="s">≈ ${esc(frac(v, S.prec))}</div>` : ''}</div>`; }).join('')}</div>
    <div class="card list">${li('Perimeter', side(t.a + t.b + t.c), 'orange')}${S.frac ? li('Sides to 1/' + S.prec, `a ${frac(t.a, S.prec)} · b ${frac(t.b, S.prec)} · c ${frac(t.c, S.prec)}`, 'orange') : ''}${li('Type', kind(t))}</div>`;
}
function clearSolved() { KEYS.forEach(x => { const f = $('#' + x).parentElement; if (f.classList.contains('solved')) { $('#' + x).value = ''; f.classList.remove('solved'); } }); }

KEYS.forEach(x => {
  const el = $('#' + x);
  el.addEventListener('focus', () => { if (el.parentElement.classList.contains('solved')) { el.value = ''; el.parentElement.classList.remove('solved'); } });
  el.addEventListener('input', () => { clearSolved(); which = 0; update(); });
});
$('#alt').addEventListener('click', e => { const b = e.target.closest('[data-sol]'); if (b) { which = +b.dataset.sol; clearSolved(); update(); } });
$('#clear').onclick = () => { KEYS.forEach(x => $('#' + x).value = ''); which = 0; buzz(8); update(); $('#a').focus(); };
$('#right').onclick = () => { clearSolved(); $('#C').value = '90'; buzz(8); update(); if (!$('#a').value) $('#a').focus(); };
$('#setBtn').onclick = () => {
  const el = sheet(`<h2>Settings</h2>${themeSegHTML()}
    <div class="label">Inch fractions next to lengths</div>
    <div class="seg">${[[false, 'Off'], [true, 'On']].map(([v, l]) => `<button data-frac="${v}" class="${S.frac === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="label">Round to</div>
    <div class="seg">${[16, 8, 32, 64].map(p => `<button data-prec="${p}" class="${S.prec === p ? 'on' : ''}">1/${p}</button>`).join('')}</div>
    <p class="hint" style="margin-top:16px">Sides accept fractions (3 1/2) and feet-inches (5' 3 1/2"), converted to inches.</p>${homeLinkHTML()}`);
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-frac]'), p = e.target.closest('[data-prec]');
    if (a) { S.frac = a.dataset.frac === 'true'; el.querySelectorAll('[data-frac]').forEach(x => x.classList.toggle('on', x === a)); }
    if (p) { S.prec = +p.dataset.prec; el.querySelectorAll('[data-prec]').forEach(x => x.classList.toggle('on', x === p)); }
    if (a || p) { persist(); clearSolved(); update(); }
  });
};

KEYS.forEach(x => $('#' + x).value = S.v[x] || '');
update();
</script>
</body>
</html>
