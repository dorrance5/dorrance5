<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TV Mount">
<meta name="theme-color" content="#F4F4F5">
<meta name="description" content="Plan where to drill so a wall-mounted TV lands at the planned height. Dimensioned sketch, studs, viewing angle. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/base.css">
<title>TV Mount</title>
<style>
:root{
  --wall:rgba(0,0,0,.08);--tv:#1E2126;--tv-line:#000;--wood:#C7956A;--wood-line:#8F5F36;--stud:#946F00;--zone:#1F845A;--drill:#C9372C;--plate:#1D7AFC;--dimc:#4B4F57;--halo:#fff;--eye:#6E5DC6;--built:#6A9A23;--sb:#227D9B;--cl:#CD519D
}
:root[data-mode="dark"]{
  --wall:rgba(255,255,255,.08);--tv:#0D0E0F;--tv-line:rgba(230,231,233,.45);--wood:#7A5534;--wood-line:#C9A27E;--stud:#E2B203;--zone:#4BCE97;--drill:#F87168;--plate:#579DFF;--dimc:#B9BCC2;--halo:#1F2023;--eye:#9F8FEF;--built:#B3DF72;--sb:#6CC3E0;--cl:#E774BB
}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:2px 7px;border-radius:7px}

/* tabs: the shared parts are in shared/base.css */
.tabs .add{width:40px;padding:0;font-size:20px}

/* sketch */
.skc{padding:0;position:relative;overflow:hidden}
.sk{display:block;width:100%;height:300px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.sk:active{cursor:grabbing}
.sk-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 0 14px}
.sk-tag{flex:1;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-bar button{height:30px;padding:0 10px;border-radius:10px;background:var(--chip);border:.5px solid var(--chip-line);display:flex;align-items:center;gap:5px;font-size:13px;font-weight:650}
.sk-bar svg{width:15px;height:15px}
.sk text{font-family:var(--ui);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
.sk .tv{fill:var(--tv);stroke:var(--tv-line);stroke-width:2}
.sk .sbar{fill:var(--tv);stroke:var(--sb);stroke-width:2}
.sk .scr{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1}
.sk .plate{fill:var(--plate);fill-opacity:.22;stroke:var(--plate);stroke-width:1.5}
.sk .drill{stroke:var(--drill);stroke-width:2;stroke-dasharray:7 4}
.sk .hole{fill:var(--drill);stroke:#fff;stroke-width:1.5}
.sk .center{stroke:var(--cl);stroke-width:1;stroke-dasharray:10 4 2 4}
.sk .cmark{stroke:#fff;stroke-width:1.5}
.sk .stud{stroke:var(--stud);stroke-width:1.5;stroke-dasharray:5 4}
.sk .floor,.sk .ceiling{stroke:var(--text);stroke-width:2.5}
.sk .ffloor{stroke:var(--text);stroke-width:1.2;stroke-dasharray:6 4}
.sk .mantle{fill:var(--wood);stroke:var(--wood-line);stroke-width:1.5}
.sk .zone{stroke:var(--zone);stroke-width:1;stroke-dasharray:3 3}
.sk .hl{stroke:var(--zone);stroke-width:.35;stroke-opacity:.7}
.sk .box{fill:none;stroke:var(--zone);stroke-width:2}
.sk .built{fill:none;stroke:var(--built);stroke-width:1.5;stroke-dasharray:6 3}
.sk .eye{stroke:var(--eye);stroke-width:1.5;stroke-dasharray:2 4}
.sk .wall{stroke:var(--text);stroke-width:2}
.sk .wallfill{fill:var(--wall)}
.sk .edge{stroke:var(--cl);stroke-width:1.5}
.sk .markline{stroke:var(--cl);stroke-width:1;stroke-dasharray:2 3}
.sk .dim{stroke:var(--dimc);stroke-width:1}
.sk .ext{stroke:var(--dimc);stroke-width:.6;opacity:.55}
.sk .dl{fill:var(--dimc);font-weight:650}
.sk .dl.drl{fill:var(--drill)}
.sk .dl.in{fill:var(--orange)}.sk .dl.tvd{fill:var(--purple)}.sk .dl.br{fill:var(--blue)}.sk .dl.sb{fill:var(--teal)}.sk .dl.cl{fill:var(--magenta)}
.sk .cll{fill:var(--magenta);font-weight:600}
.sk .ll{fill:var(--muted);font-weight:600}
.sk .tl{fill:#fff;stroke:none;font-weight:600}
.sk .ml{fill:#fff;stroke:none;font-weight:700;opacity:.9}
.sk .gl{fill:var(--dimc);font-weight:600}
.sk .stl{fill:var(--stud);font-weight:650}
.sk .el{fill:var(--eye);font-weight:650}
.sk .zl{fill:var(--zone);font-weight:700}
.sk .bl{fill:var(--built);stroke:none;font-weight:700}
.sk .sbl{fill:#fff;stroke:none;font-weight:650;opacity:.85}

/* results: the shared parts are in shared/base.css */
.warns{margin:8px 2px 0;padding:0;list-style:none}
.warns li{color:var(--red);font-size:14px;font-weight:600;padding:3px 0 3px 22px;position:relative;line-height:1.35}
.warns li::before{content:"!";position:absolute;left:4px;top:4px;width:14px;height:14px;border-radius:7px;background:var(--red);color:var(--bg);font-size:11px;font-weight:800;text-align:center;line-height:14px}

/* form: the shared parts are in shared/base.css */
.sec .studchip.on{border-color:var(--hl);box-shadow:0 0 0 3px var(--hbg)}
.res{margin-top:10px;font-size:15px;padding:10px 12px;border-radius:12px;background:var(--blue-bg);color:var(--blue)}
.res b{font-size:18px;font-variant-numeric:tabular-nums}
.sizes{gap:6px}
.sizes .chip{height:38px;padding:0 0;width:calc((100% - 24px)/5);font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}
.row>.btn{flex:1;height:42px;font-size:15px;padding:0 10px}
.btn .cnt{font-size:12px;font-weight:700;background:var(--sel);color:var(--sel-text);border-radius:8px;padding:1px 6px}
.studs{display:flex;flex-wrap:wrap;gap:6px}
.studchip{display:inline-flex;align-items:center;height:40px;border-radius:13px;background:var(--chip);border:.5px solid var(--chip-line);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden}
.studchip .sv{padding:0 4px 0 12px;height:100%;display:flex;align-items:center}
.studchip .sx{width:34px;height:100%;color:var(--muted);font-size:18px}
.chain{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--chip);font-variant-numeric:tabular-nums;line-height:1.5}
.ver{text-align:center;color:var(--muted);font-size:12px;margin:16px 0 4px}
.libl{max-height:44dvh;overflow-y:auto;margin:0 -4px}
.libi{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px}
.libi:last-child{border-bottom:0}
.libi .use{flex:1;text-align:left;padding:8px 4px;min-width:0}
.libi .use b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libi .use span{font-size:13px;color:var(--muted)}
.libi .del{width:40px;height:40px;border-radius:12px;color:var(--danger-text);font-size:18px}
.sheet .input{margin-bottom:10px}
.sheet .stack{margin-top:14px}

/* keypad: whole inches on the left, numerator over denominator on the right, like Calculator */
.kp{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:.5px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);box-shadow:0 -10px 30px rgba(0,0,0,.14);animation:up .16s ease-out}
.kp-in{max-width:560px;margin:0 auto}
.kp-top{display:flex;align-items:center;gap:10px;padding:0 4px 8px;min-height:40px}
.kp-name{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2;flex:1;min-width:0}
.kp-name .live{display:block;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-val{display:flex;align-items:center;justify-content:flex-end;font-size:30px;font-weight:550;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:58%;overflow:hidden;height:34px}
.kp-val.ph{color:var(--muted);opacity:.6}
.kp-val .fr{display:flex;flex-direction:column;align-items:center;font-size:.48em;line-height:1;margin:0 .1em 0 .14em;font-weight:650}
.kp-val .fr .de{border-top:1.5px solid currentColor;padding-top:1px;margin-top:1px}
.kp-val .fr .lit.nu{color:var(--teal)}
.kp-val .fr .lit.de{color:var(--purple)}
.kp-keys{display:grid;grid-template-columns:3fr 5fr;gap:10px;height:202px}
.kp-whole{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:6px;min-height:0}
.kp-frac{display:flex;flex-direction:column;gap:6px;min-height:0}
.kp-sub{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:5px;min-height:0}
.kp-div{flex:none;height:5px;border-radius:2.5px;background:linear-gradient(90deg,var(--teal),var(--purple))}
.kp button{height:46px;border-radius:13px;background:var(--tile);border:.5px solid var(--tile-line);box-shadow:var(--tile-shadow);font-size:24px;font-weight:450;font-variant-numeric:tabular-nums;padding:0;transition:transform .08s}
.kp button:active{transform:scale(.94);filter:brightness(.92)}
.kp-keys button{height:auto;min-height:0;min-width:0}
.kp .kp-sub button{font-size:21px;font-weight:550;border-radius:11px}
.kp .nu button{color:var(--teal)}
.kp .de button{color:var(--purple)}
.kp .kp-whole .sym{font-size:22px;color:var(--muted)}
.kp-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.5fr;gap:6px;margin-top:6px}
.kp-bar button{font-size:16px;font-weight:600;background:var(--chip);border-color:var(--chip-line);box-shadow:none}
.kp-bar .clr{background:var(--danger);border-color:var(--danger-line);color:var(--danger-text)}
.kp-bar .nav{background:var(--blue-bg);color:var(--blue)}
.kp-bar .done{background:var(--primary);border-color:var(--primary-line);color:var(--primary-text)}
.kp-bar svg{width:20px;height:20px;vertical-align:middle}

/* screenshot mode */
.shot{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.shot .cap{padding:4px 8px 6px;flex:none}
.shot .cap b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.shot .cap span{display:block;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.shot .cap span.e{font-size:14px}
.shot .sk{flex:1;height:auto;min-height:0}
.shot .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:40px;height:40px;border-radius:20px;background:var(--chip);border:.5px solid var(--chip-line);font-size:18px;transition:opacity .4s}
.shot .x.gone,.shot .vw.gone{opacity:0;pointer-events:none}
.shot .vw{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:228px;padding:4px;gap:4px;border-radius:17px;background:var(--tile);box-shadow:0 2px 14px rgba(0,0,0,.14);transition:opacity .4s}
.shot .vw button{height:34px}
</style>
</head>
<body>
<header>
  <a class="round" href="../" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
  <h1>TV Mount</h1>
  <span class="sp"></span>
  <button class="round" id="shotBtn" aria-label="Screenshot mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg></button>
  <button class="round" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<nav class="tabs" id="tabs" aria-label="TV locations"></nav>

<main id="main">
  <div class="card skc">
    <div class="sk-bar"><span class="sk-tag" id="skTag"></span><button id="fitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>Fit</button></div>
    <svg class="sk" id="sk" aria-label="Wall sketch" role="img"></svg>
  </div>
  <div id="res"></div>
  <div id="form"></div>
  <div class="ver" id="ver"></div>
</main>

<div class="kp" id="kp" hidden>
  <div class="kp-in">
    <div class="kp-top"><div class="kp-name" id="kpName"></div><div class="kp-val" id="kpVal"></div></div>
    <div class="kp-keys">
      <div class="kp-whole" role="group" aria-label="Whole inches">
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="." class="sym" aria-label="Decimal point">.</button><button data-key="0">0</button>
        <button data-key="back" class="sym" aria-label="Delete"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11v12H9l-6-6z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg></button>
      </div>
      <div class="kp-frac">
        <div class="kp-sub nu" id="kpNu" role="group" aria-label="Numerator"></div>
        <div class="kp-div"></div>
        <div class="kp-sub de" id="kpDe" role="group" aria-label="Denominator"></div>
      </div>
    </div>
    <div class="kp-bar">
      <button data-key="sign" aria-label="Plus or minus">±</button>
      <button data-key="clear" class="clr">Clear</button>
      <button data-key="prev" class="nav" aria-label="Previous field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
      <button data-key="next" class="nav" aria-label="Next field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button data-key="done" class="done">Done</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="../shared/base.js"></script>
<script src="geometry.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
