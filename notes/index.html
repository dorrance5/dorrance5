<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="Quick notes that save as you type and stay on your device. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/base.css">
<title>Notes</title>
<style>
body{-webkit-user-select:auto;user-select:auto}
.search{margin:2px 0 12px}
.note{display:block;width:100%;text-align:left}
.note .t{font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .p{color:var(--muted);font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .d{color:var(--muted);font-size:13px;margin-top:6px}
#editor{display:flex;flex-direction:column;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#editor textarea{flex:1;width:100%;resize:none;border:0;outline:none;background:var(--tile);border:.5px solid var(--tile-line);box-shadow:var(--tile-shadow);border-radius:18px;padding:16px;font-size:18px;line-height:1.5;color:var(--text);font-family:var(--ui)}
#editor textarea::placeholder{color:var(--muted)}
.count{color:var(--muted);font-size:13px;text-align:right;padding:8px 6px 0}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:60px;height:60px;border-radius:20px;background:var(--primary);border:.5px solid var(--primary-line);color:var(--primary-text);box-shadow:0 8px 24px rgba(0,0,0,.2);display:grid;place-items:center;z-index:3}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}
</style>
</head>
<body>
<header id="hList">
  <a class="round" href="../" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
  <h1>Notes</h1>
  <span class="sp"></span>
  <button class="round" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<header id="hEdit" hidden>
  <button class="round" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
  <h1 id="eTitle">Note</h1>
  <span class="sp"></span>
  <button class="round" id="shareBtn" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
  <button class="round" id="delBtn" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</header>

<main id="list">
  <input class="input search" id="q" type="search" placeholder="Search" autocomplete="off">
  <div id="notes"></div>
</main>
<main id="editor" hidden>
  <textarea id="text" placeholder="Start typing…"></textarea>
  <div class="count" id="count"></div>
</main>
<button class="fab" id="addBtn" aria-label="New note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<script src="../shared/base.js"></script>
<script>
const { $, esc, uid, load, save, sheet, closeSheet, toast, copy, themeSegHTML } = App;
App.init();

const KEY = 'notes-v1';
const S = Object.assign({ notes: [] }, load(KEY, {}));
const persist = () => save(KEY, S);
let cur = null, saveT;

const title = n => (n.text.trim().split('\n')[0] || 'New note').slice(0, 80);
const preview = n => n.text.trim().split('\n').slice(1).join(' ').trim();
function when(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
}

function paintList() {
  const q = $('#q').value.trim().toLowerCase();
  const arr = S.notes.filter(n => !q || n.text.toLowerCase().includes(q)).sort((a, b) => b.updated - a.updated);
  $('#notes').innerHTML = arr.length
    ? arr.map(n => `<button class="card note" data-id="${n.id}"><div class="t">${esc(title(n))}</div>${preview(n) ? `<div class="p">${esc(preview(n))}</div>` : ''}<div class="d">${when(n.updated)}</div></button>`).join('')
    : `<div class="empty">${q ? 'No matches.' : 'No notes yet.<br>Tap + to write one.'}</div>`;
}

function open(id) {
  cur = S.notes.find(n => n.id === id); if (!cur) return;
  $('#hList').hidden = true; $('#list').hidden = true; $('#addBtn').hidden = true;
  $('#hEdit').hidden = false; $('#editor').hidden = false;
  $('#text').value = cur.text; $('#eTitle').textContent = title(cur); paintCount();
  if (location.hash !== '#' + id) history.pushState(null, '', '#' + id);
  if (!cur.text) $('#text').focus();
}
function back() {
  flush();
  if (cur && !cur.text.trim()) S.notes = S.notes.filter(n => n !== cur);   // drop empty notes
  persist(); cur = null;
  $('#hList').hidden = false; $('#list').hidden = false; $('#addBtn').hidden = false;
  $('#hEdit').hidden = true; $('#editor').hidden = true;
  if (location.hash) history.replaceState(null, '', location.pathname);
  paintList();
}
function flush() {
  clearTimeout(saveT);
  if (!cur) return;
  const v = $('#text').value;
  if (v !== cur.text) { cur.text = v; cur.updated = Date.now(); persist(); }
  $('#eTitle').textContent = title(cur);
}
function paintCount() {
  const v = $('#text').value, w = v.trim() ? v.trim().split(/\s+/).length : 0;
  $('#count').textContent = `${w} word${w === 1 ? '' : 's'} · ${v.length} chars`;
}

$('#text').addEventListener('input', () => { clearTimeout(saveT); saveT = setTimeout(flush, 300); paintCount(); });
$('#text').addEventListener('blur', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);
window.addEventListener('popstate', () => { if (cur && !location.hash) back(); else if (location.hash) open(location.hash.slice(1)); });

$('#addBtn').onclick = () => { const n = { id: uid(), text: '', created: Date.now(), updated: Date.now() }; S.notes.push(n); persist(); open(n.id); };
$('#notes').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) open(b.dataset.id); });
$('#q').addEventListener('input', paintList);
$('#backBtn').onclick = back;
$('#delBtn').onclick = () => { if (confirm('Delete this note?')) { S.notes = S.notes.filter(n => n !== cur); cur = null; persist(); back(); toast('Deleted'); } };
$('#shareBtn').onclick = async () => {
  flush();
  if (navigator.share) { try { await navigator.share({ title: title(cur), text: cur.text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  toast(await copy(cur.text) ? 'Copied' : "Couldn't copy");
};
$('#setBtn').onclick = () => {
  const el = sheet(`<h2>Settings</h2>${themeSegHTML()}
    <div class="label">Data</div>
    <div class="stack"><button class="btn" data-act="export">Copy all notes as text</button>
    <button class="danger" data-act="wipe">Delete all notes</button></div>
    <p style="color:var(--muted);font-size:14px;margin:14px 0 0">Notes stay in this browser on this device. Nothing is sent anywhere.</p>`);
  el.addEventListener('click', async e => {
    const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
    if (a === 'export') {
      const txt = S.notes.sort((a, b) => b.updated - a.updated).map(n => `# ${title(n)}\n${new Date(n.updated).toLocaleString()}\n\n${n.text.trim()}`).join('\n\n---\n\n');
      toast(await copy(txt) ? `Copied ${S.notes.length} notes` : "Couldn't copy");
    }
    if (a === 'wipe' && S.notes.length && confirm(`Delete all ${S.notes.length} notes? This can't be undone.`)) { S.notes = []; persist(); closeSheet(); paintList(); }
  });
};
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); $('#addBtn').click(); }
  if (e.key === 'Escape' && cur) back();
});

paintList();
if (location.hash) open(location.hash.slice(1));
</script>
</body>
</html>
