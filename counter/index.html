<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Counter">
<meta name="theme-color" content="#F4F4F5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="description" content="Tally counters with colors, sorting and history. Works offline.">
<title>Counter</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Each counter is a card in its color, like the colored result cards in TV Mount:
   a pale tint of the hue, the name in the hue, the count on a tile. */
.cnt{display:grid;grid-template-columns:1fr auto;min-height:96px;padding:0;background:var(--cbg);border-color:transparent;color:var(--c);cursor:pointer;transition:filter .1s}
.cnt:active{filter:brightness(.96)}
.left{padding:14px 16px 8px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.name{font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today{font-size:13px;font-weight:600;opacity:.8;margin-top:2px;white-space:nowrap}
.chev{width:44px;height:36px;margin-left:-10px;display:grid;place-items:center}
.chev svg{width:22px;height:22px;transition:transform .2s}
.open .chev svg{transform:rotate(180deg)}
.num{margin:8px;border-radius:14px;background:var(--cbox);min-width:42vw;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;transform-origin:right center;letter-spacing:-.02em}
.num svg{width:28px;height:28px;opacity:.9}
.bump{animation:bump .18s ease-out}
@keyframes bump{40%{transform:scale(1.1)}}
.more{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:0 8px 8px}
.more button{height:44px;padding:0 18px;border-radius:13px;font-size:17px;font-weight:650}
.move{display:flex;gap:6px}
.move button{width:40px;height:34px;border-radius:10px;display:grid;place-items:center}
.more button,.move button{background:var(--cbox);color:var(--c)}
.move button:disabled{opacity:.35}
.move svg{width:20px;height:20px}
.cnt,.sw{--cbox:var(--tile)}
.c-blue{--c:var(--blue);--cbg:var(--blue-bg)}.c-red{--c:var(--red);--cbg:var(--red-bg)}.c-yellow{--c:var(--yellow);--cbg:var(--yellow-bg)}
.c-green{--c:var(--green);--cbg:var(--green-bg)}.c-purple{--c:var(--purple);--cbg:var(--purple-bg)}.c-orange{--c:var(--orange);--cbg:var(--orange-bg)}
.c-gray{--c:var(--muted);--cbg:var(--tile);--cbox:var(--chip)}
.cnt.c-gray{color:var(--text);border-color:var(--tile-line)}
.swatches{display:flex;gap:10px;margin:4px 0 18px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--tile);box-shadow:0 0 0 2px transparent}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.sheet .input{margin-bottom:14px}
.sheet .stack{margin-top:4px}
</style>
</head>
<body>
<header>
  <button class="round" id="addBtn" aria-label="Add counter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="round pill" id="editBtn">Edit</button>
  <button class="round" id="sortBtn" aria-label="Sort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M2.5 6.5 5 4l2.5 2.5M2.5 17.5 5 20l2.5-2.5M11 6h10M11 12h10M11 18h7"/></svg></button>
  <span class="sp"></span>
  <button class="round" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main id="list"></main>

<script src="../shared/base.js"></script>
<script>
const KEY = 'counter-v1';
// Calculator palette: blue, red, yellow first
const COLORS = ['#0A57D0','#D02A2A','#F4B400','#1F9D55','#7C3AED','#F28A00','#6E6E76'];
// old palette -> new, so existing counters pick up the new colors
const OLD_COLORS = {'#4fb89a':'#1F9D55','#4a8fd9':'#0A57D0','#e0a13a':'#F4B400','#FFD60A':'#F4B400','#e06a58':'#D02A2A','#8b6fd6':'#7C3AED','#3fa7b8':'#0A57D0','#0E8FB8':'#0A57D0','#7a8a99':'#6E6E76'};
const ICON = {
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>'
};

const { $, esc, uid, buzz, sheet, closeSheet, themeSegHTML, homeLinkHTML } = App;
// Saved colors stay as they are; each one shows as the matching TV Mount hue.
const HUE = {'#0A57D0':'blue','#D02A2A':'red','#F4B400':'yellow','#1F9D55':'green','#7C3AED':'purple','#F28A00':'orange','#6E6E76':'gray'};
const hueClass = color => HUE[color] ? ' c-' + HUE[color] : '';
const hueStyle = color => HUE[color] ? '' : ` style="--c:${esc(color)};--cbg:color-mix(in srgb,${esc(color)} 16%,var(--tile))"`;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.counters)) {
      s.counters.forEach(c => { if (OLD_COLORS[c.color]) c.color = OLD_COLORS[c.color]; });
      return Object.assign({sort:'manual', theme:'auto'}, s);
    }
  } catch (e) {}
  return {counters:[], sort:'manual', theme:'auto'};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
// One theme setting is shared by every app on this site (shared/base.js). Counter also keeps
// a copy in its own data, as before; an old copy still counts when the shared setting is missing.
function loadTheme() { try { return localStorage.getItem('theme') || S.theme || 'auto'; } catch (e) { return 'auto'; } }
function syncTheme() { try { const t = localStorage.getItem('theme'); if (t && t !== S.theme) { S.theme = t; save(); } } catch (e) {} }

let S = load();
S.theme = loadTheme();
try { if (!localStorage.getItem('theme') && S.theme !== 'auto') localStorage.setItem('theme', S.theme); } catch (e) {}
let editing = false;
const expanded = new Set();

// events = list of tap timestamps
const count = c => c.events.length;
const today = c => { const d = new Date(); d.setHours(0, 0, 0, 0); const t = d.getTime(); let n = 0; for (let i = c.events.length - 1; i >= 0 && c.events[i] >= t; i--) n++; return n; };

function sorted() {
  const a = [...S.counters];
  if (S.sort === 'name') a.sort((x, y) => x.name.localeCompare(y.name, undefined, {numeric:true}));
  if (S.sort === 'count') a.sort((x, y) => count(y) - count(x));
  return a;
}

function cardHTML(c, i, n) {
  const open = expanded.has(c.id) && !editing;
  const left = editing
    ? (S.sort === 'manual'
        ? `<div class="move"><button data-action="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ICON.up}</button><button data-action="down" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">${ICON.down}</button></div>`
        : '<div></div>')
    : `<button class="chev" data-action="toggle" aria-label="More">${ICON.chev}</button>`;
  return `<div class="card cnt${open ? ' open' : ''}${hueClass(c.color)}"${hueStyle(c.color)} data-id="${c.id}" data-action="${editing ? 'edit' : 'inc'}">
    <div class="left"><div><div class="name">${esc(c.name)}</div>${!editing && today(c) && today(c) !== count(c) ? `<div class="today">${today(c)} today</div>` : ''}</div>${left}</div>
    <div class="num" id="n-${c.id}">${editing ? ICON.pen : count(c)}</div>
    ${open ? `<div class="more" data-action="none">
      <button data-action="dec">−1</button>
      <button data-action="reset">Reset</button>
    </div>` : ''}
  </div>`;
}

function render() {
  $('#editBtn').textContent = editing ? 'Done' : 'Edit';
  const arr = sorted();
  $('#list').innerHTML = arr.length
    ? arr.map((c, i) => cardHTML(c, i, arr.length)).join('')
    : `<div class="empty"><p>No counters yet.</p><button class="primary" data-action="add">Add a counter</button></div>`;
}

function bump(id) {
  const el = document.getElementById('n-' + id);
  if (!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/* Sheets */

function openCounterSheet(c) {
  let color = c ? c.color : COLORS[S.counters.length % COLORS.length];
  const el = sheet(`<h2>${c ? 'Edit counter' : 'New counter'}</h2>
    <input class="input" id="fName" type="text" placeholder="Name" maxlength="30" autocomplete="off" enterkeyhint="done" value="${c ? esc(c.name) : ''}">
    <div class="swatches">${COLORS.map(x => `<button class="sw${x === color ? ' on' : ''} c-${HUE[x]}" data-color="${x}" aria-label="Color"></button>`).join('')}</div>
    <div class="actions">${c ? '<button class="danger" data-act="del">Delete</button>' : ''}<span class="sp"></span>
      <button class="btn" data-act="cancel">Cancel</button><button class="primary" data-act="save">${c ? 'Save' : 'Add'}</button></div>`, 'top');
  const input = el.querySelector('#fName');
  input.focus();

  const doSave = () => {
    const name = input.value.trim();
    if (!name) { input.placeholder = 'Enter a name'; input.focus(); return; }
    if (c) { c.name = name; c.color = color; }
    else S.counters.push({id: uid(), name, color, events: []});
    save(); closeSheet(); render();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });
  el.addEventListener('click', e => {
    const sw = e.target.closest('[data-color]');
    if (sw) {
      color = sw.dataset.color;
      el.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s === sw));
      return;
    }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') closeSheet();
    if (act === 'save') doSave();
    if (act === 'del' && confirm(`Delete ${c.name}?`)) {
      S.counters = S.counters.filter(x => x !== c);
      save(); closeSheet(); render();
    }
  });
}

function openSortSheet() {
  const opts = [['manual','Manual order'],['name','Name'],['count','Highest count']];
  const el = sheet(`<h2>Sort</h2>${opts.map(([k, l]) =>
    `<button class="opt" data-sort="${k}">${l}<span class="check">${S.sort === k ? '✓' : ''}</span></button>`).join('')}`);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    S.sort = b.dataset.sort; save(); closeSheet(); render();
  });
}

function openSettings() {
  const el = sheet(`<h2>Settings</h2>
    ${themeSegHTML()}
    <div class="stack">
      <button class="danger" data-act="all">Reset all counts</button>
      <button class="danger" data-act="wipe">Delete all counters</button>
    </div>${homeLinkHTML()}`);
  el.addEventListener('click', e => {
    setTimeout(syncTheme);   // the shared sheet sets the theme after this handler
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'all' && confirm('Reset every counter to 0?')) {
      S.counters.forEach(c => c.events = []);
      save(); closeSheet(); render();
    }
    if (act === 'wipe' && S.counters.length && confirm(`Delete all ${S.counters.length} counters? This can't be undone.`)) {
      S.counters = []; expanded.clear(); editing = false;
      save(); closeSheet(); render();
    }
  });
}

/* Events */
$('#list').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  if (a === 'add') return openCounterSheet();
  const id = e.target.closest('.card')?.dataset.id;
  const c = S.counters.find(x => x.id === id);
  if (!c) return;

  if (a === 'inc') { c.events.push(Date.now()); save(); render(); bump(id); buzz(12); }
  if (a === 'dec' && count(c) > 0) { c.events.pop(); save(); render(); bump(id); buzz([8, 30, 8]); }
  if (a === 'toggle') { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
  if (a === 'edit') openCounterSheet(c);
  if (a === 'reset' && confirm(`Reset ${c.name} to 0?`)) { c.events = []; save(); render(); }
  if (a === 'up' || a === 'down') {
    const i = S.counters.indexOf(c), j = a === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= S.counters.length) return;
    [S.counters[i], S.counters[j]] = [S.counters[j], S.counters[i]];
    save(); render();
  }
});

$('#addBtn').onclick = () => openCounterSheet();
$('#editBtn').onclick = () => { editing = !editing; render(); };
$('#sortBtn').onclick = openSortSheet;
$('#setBtn').onclick = openSettings;
window.addEventListener('storage', e => { if (e.key === 'theme' && e.newValue) S.theme = e.newValue; });

App.init();
render();
</script>
</body>
</html>
