<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checklist">
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="Simple checklists: groceries, packing, chores. Stays on your device. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/base.css">
<title>Checklist</title>
<style>
header h1{display:flex;align-items:center;gap:6px;cursor:pointer}
header h1 svg{width:18px;height:18px;color:var(--muted);flex:none}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--tile);border:.5px solid var(--tile-line);box-shadow:var(--tile-shadow);border-radius:16px;margin-bottom:8px;text-align:left;font-size:18px;transition:opacity .15s}
.item .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:#fff}
.item .box svg{width:16px;height:16px;opacity:0}
.item.done .box{background:var(--green);border-color:var(--green)}
.item.done .box svg{opacity:1}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.item .move{display:flex;gap:6px}
.item .move button,.item .x{width:40px;height:36px;border-radius:10px;background:var(--chip);border:.5px solid var(--chip-line);display:grid;place-items:center;flex:none}
.item .move button:disabled{opacity:.35}
.item .move svg,.item .x svg{width:20px;height:20px}
.item .x{color:var(--red)}
[data-mode="aurora"] .item{-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
footer{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:.5px solid var(--line);background:var(--bg);position:relative;z-index:2}
footer .input{flex:1}
footer .primary{width:50px;padding:0;height:50px}
footer .primary svg{width:24px;height:24px}
.done-row{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:10px 6px 6px}
.done-row button{color:var(--red);font-weight:600;font-size:14px}
</style>
</head>
<body>
<header>
  <a class="round" href="../" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
  <h1 id="title"><span id="listName">List</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></h1>
  <span class="sp"></span>
  <button class="round pill" id="editBtn">Edit</button>
  <button class="round" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main id="items"></main>

<footer>
  <input class="input" id="newItem" type="text" placeholder="Add an item" autocomplete="off" enterkeyhint="done" maxlength="200">
  <button class="primary" id="addBtn" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</footer>

<script src="../shared/base.js"></script>
<script>
const { $, esc, uid, load, save, buzz, sheet, closeSheet, toast, copy, themeSegHTML } = App;
App.init();

const KEY = 'checklist-v1';
const S = Object.assign({ lists: [], cur: null, hideDone: false }, load(KEY, {}));
if (!S.lists.length) S.lists.push({ id: uid(), name: 'Groceries', items: [] });
if (!S.lists.find(l => l.id === S.cur)) S.cur = S.lists[0].id;
const persist = () => save(KEY, S);
const list = () => S.lists.find(l => l.id === S.cur);
let editing = false;

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

function render() {
  const L = list();
  $('#listName').textContent = L.name;
  document.title = L.name + ' · Checklist';
  $('#editBtn').textContent = editing ? 'Done' : 'Edit';
  const items = L.items, done = items.filter(i => i.done).length;
  const shown = S.hideDone && !editing ? items.filter(i => !i.done) : items;
  $('#items').innerHTML = (shown.length ? shown.map(it => {
    const i = items.indexOf(it);
    return `<div class="item${it.done ? ' done' : ''}" data-id="${it.id}" ${editing ? '' : 'data-action="toggle" role="button" tabindex="0"'}>
      ${editing ? '' : `<span class="box">${ICON.check}</span>`}
      <span class="txt" ${editing ? 'data-action="rename"' : ''}>${esc(it.text)}</span>
      ${editing ? `<div class="move"><button data-action="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ICON.up}</button><button data-action="down" ${i === items.length - 1 ? 'disabled' : ''} aria-label="Move down">${ICON.down}</button></div><button class="x" data-action="del" aria-label="Delete">${ICON.x}</button>` : ''}
    </div>`;
  }).join('') : `<div class="empty">${items.length ? 'All done.' : 'Nothing here yet.<br>Add an item below.'}</div>`)
  + (done ? `<div class="done-row"><span>${done} of ${items.length} done</span><button data-action="clear">Clear done</button></div>` : '');
}

function add() {
  const v = $('#newItem').value.trim(); if (!v) return;
  list().items.push({ id: uid(), text: v, done: false });
  $('#newItem').value = ''; persist(); render(); buzz(8);
  $('#items').scrollTop = $('#items').scrollHeight;
}
$('#addBtn').onclick = () => { add(); $('#newItem').focus(); };
$('#newItem').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });

$('#items').addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, L = list();
  if (a === 'clear') { L.items = L.items.filter(i => !i.done); persist(); render(); return; }
  const id = e.target.closest('.item')?.dataset.id, it = L.items.find(i => i.id === id); if (!it) return;
  const i = L.items.indexOf(it);
  if (a === 'toggle') { it.done = !it.done; buzz(it.done ? 12 : 6); }
  if (a === 'del') L.items.splice(i, 1);
  if (a === 'rename') { const v = prompt('Rename item', it.text); if (v != null && v.trim()) it.text = v.trim(); }
  if (a === 'up' && i > 0) [L.items[i - 1], L.items[i]] = [L.items[i], L.items[i - 1]];
  if (a === 'down' && i < L.items.length - 1) [L.items[i + 1], L.items[i]] = [L.items[i], L.items[i + 1]];
  persist(); render();
});
$('#items').addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.dataset.action === 'toggle') { e.preventDefault(); e.target.click(); } });
$('#editBtn').onclick = () => { editing = !editing; render(); };

/* lists */
$('#title').onclick = () => {
  const el = sheet(`<h2>Lists</h2>${S.lists.map(l => `<button class="opt" data-list="${l.id}">${esc(l.name)}<span class="check">${l.items.filter(i => !i.done).length || ''} ${l.id === S.cur ? '✓' : ''}</span></button>`).join('')}
    <div class="stack" style="margin-top:16px"><button class="btn" data-act="new">New list</button></div>`);
  el.addEventListener('click', e => {
    const l = e.target.closest('[data-list]');
    if (l) { S.cur = l.dataset.list; editing = false; persist(); closeSheet(); render(); return; }
    if (e.target.closest('[data-act="new"]')) {
      const v = prompt('List name'); if (!v || !v.trim()) return;
      const n = { id: uid(), name: v.trim(), items: [] }; S.lists.push(n); S.cur = n.id; persist(); closeSheet(); render();
    }
  });
};
$('#setBtn').onclick = () => {
  const L = list();
  const el = sheet(`<h2>${esc(L.name)}</h2>${themeSegHTML()}
    <div class="label">View</div>
    <button class="opt" data-act="hide">Hide completed items<span class="check">${S.hideDone ? '✓' : ''}</span></button>
    <div class="label">This list</div>
    <div class="stack">
      <button class="btn" data-act="rename">Rename list</button>
      <button class="btn" data-act="copy">Copy as text</button>
      <button class="btn" data-act="uncheck">Uncheck everything</button>
      <button class="danger" data-act="del">Delete list</button>
    </div>`);
  el.addEventListener('click', async e => {
    const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
    if (a === 'hide') { S.hideDone = !S.hideDone; persist(); e.target.closest('.opt').querySelector('.check').textContent = S.hideDone ? '✓' : ''; render(); }
    if (a === 'rename') { const v = prompt('List name', L.name); if (v && v.trim()) { L.name = v.trim(); persist(); closeSheet(); render(); } }
    if (a === 'copy') toast(await copy(L.name + '\n' + L.items.map(i => `${i.done ? '[x]' : '[ ]'} ${i.text}`).join('\n')) ? 'Copied' : "Couldn't copy");
    if (a === 'uncheck') { L.items.forEach(i => i.done = false); persist(); closeSheet(); render(); }
    if (a === 'del' && confirm(`Delete "${L.name}" and its ${L.items.length} items?`)) {
      S.lists = S.lists.filter(l => l !== L);
      if (!S.lists.length) S.lists.push({ id: uid(), name: 'Groceries', items: [] });
      S.cur = S.lists[0].id; editing = false; persist(); closeSheet(); render();
    }
  });
};

render();
</script>
</body>
</html>
