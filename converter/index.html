<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Converter">
<meta name="theme-color" content="#F4F4F5">
<meta name="description" content="Unit converter for length, weight, temperature, volume, area and speed, with inch fractions and feet-inches. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/base.css">
<title>Converter</title>
<style>
.conv{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;margin-top:8px}
.amt .fv{font-size:28px}
.swap{min-height:58px;border-radius:14px;background:var(--hbg);border:.5px solid var(--hl);color:var(--hc);display:grid;place-items:center;transition:transform .15s}
.swap:active{transform:scale(.92)}
.swap svg{width:22px;height:22px}
.hero{cursor:pointer;margin-bottom:10px}
.hero .v{overflow-wrap:anywhere}
.hero .v .u{font-size:22px;font-weight:600;margin-left:6px;letter-spacing:0}
.units{padding:2px 16px}
.ur{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.ur:last-child{border-bottom:0}
.ur .u{font-size:16px;font-weight:650;white-space:nowrap}
.ur .u small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.ur .v{font-size:18px;font-weight:550;text-align:right;overflow-wrap:anywhere}
.ur.on .u,.ur.on .v{color:var(--blue)}
</style>
</head>
<body>
<header>
  <a class="round" href="../" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></a>
  <h1>Converter</h1>
  <span class="sp"></span>
  <button class="round" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<nav class="tabs" id="cats" aria-label="What to convert"></nav>

<main>
  <section class="card sec" id="card">
    <div class="sec-h"><span class="ic" id="catIc"></span><span id="catName"></span></div>
    <div class="sec-b">
      <label class="fld amt"><span class="fk">Amount</span><input class="fv" id="val" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></label>
      <div class="conv">
        <label class="fld"><span class="fk">From</span><select class="fv" id="from"></select></label>
        <button class="swap" id="swap" aria-label="Swap units"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></svg></button>
        <label class="fld"><span class="fk">To</span><select class="fv" id="to"></select></label>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </section>
  <div class="hero" id="outCard" title="Tap to copy"><div class="k" id="outName"></div><div class="v"><span id="out">0</span><span class="u" id="outUnit"></span></div><div class="s" id="sub"></div></div>
  <div class="card units" id="table"></div>
</main>

<script src="../shared/base.js"></script>
<script>
const { $, esc, load, save, buzz, sheet, toast, copy, themeSegHTML } = App;
App.init();

/* factor = how many base units in one of this unit. Temperature uses functions. */
const CATS = {
  Length: { base: 'm', units: {
    'mm': .001, 'cm': .01, 'm': 1, 'km': 1000,
    'in': .0254, 'ft': .3048, 'ft in': 'ftin', 'yd': .9144, 'mi': 1609.344 } },
  Weight: { base: 'kg', units: { 'g': .001, 'kg': 1, 'oz': .028349523125, 'lb': .45359237, 'st': 6.35029318, 't': 1000 } },
  Temperature: { base: '°C', units: {
    '°C': [c => c, c => c], '°F': [f => (f - 32) * 5 / 9, c => c * 9 / 5 + 32], 'K': [k => k - 273.15, c => c + 273.15] } },
  Volume: { base: 'L', units: {
    'ml': .001, 'L': 1, 'tsp': .00492892159, 'tbsp': .0147867648, 'fl oz': .0295735296, 'cup': .2365882365,
    'pt': .473176473, 'qt': .946352946, 'gal': 3.785411784, 'm³': 1000 } },
  Area: { base: 'm²', units: {
    'cm²': 1e-4, 'm²': 1, 'ha': 1e4, 'km²': 1e6, 'in²': .00064516, 'ft²': .09290304, 'yd²': .83612736, 'acre': 4046.8564224, 'mi²': 2589988.110336 } },
  Speed: { base: 'm/s', units: { 'm/s': 1, 'km/h': 1 / 3.6, 'mph': .44704, 'kn': .514444444, 'ft/s': .3048 } },
  Data: { base: 'MB', units: { 'KB': .001, 'MB': 1, 'GB': 1000, 'TB': 1e6, 'KiB': 1.024e-3, 'MiB': 1.048576, 'GiB': 1073.741824, 'TiB': 1099511.627776 } },
};
const NAMES = { mm: 'millimetres', cm: 'centimetres', m: 'metres', km: 'kilometres', in: 'inches', ft: 'feet', 'ft in': 'feet & inches', yd: 'yards', mi: 'miles',
  g: 'grams', kg: 'kilograms', oz: 'ounces', lb: 'pounds', st: 'stone', t: 'tonnes', '°C': 'Celsius', '°F': 'Fahrenheit', K: 'kelvin',
  ml: 'millilitres', L: 'litres', tsp: 'teaspoons', tbsp: 'tablespoons', 'fl oz': 'fluid ounces', cup: 'cups', pt: 'pints', qt: 'quarts', gal: 'gallons', 'm³': 'cubic metres',
  'cm²': 'square cm', 'm²': 'square metres', ha: 'hectares', 'km²': 'square km', 'in²': 'square inches', 'ft²': 'square feet', 'yd²': 'square yards', acre: 'acres', 'mi²': 'square miles',
  'm/s': 'metres per second', 'km/h': 'km per hour', mph: 'miles per hour', kn: 'knots', 'ft/s': 'feet per second',
  KB: 'kilobytes', MB: 'megabytes', GB: 'gigabytes', TB: 'terabytes', KiB: 'kibibytes', MiB: 'mebibytes', GiB: 'gibibytes', TiB: 'tebibytes' };
const DEFAULT = { Length: ['in', 'mm'], Weight: ['lb', 'kg'], Temperature: ['°F', '°C'], Volume: ['cup', 'ml'], Area: ['ft²', 'm²'], Speed: ['mph', 'km/h'], Data: ['GB', 'GiB'] };

// Each kind of unit has its own color and icon, like the cards in TV Mount.
const LOOK = {
  Length: ['orange', '<rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>'],
  Weight: ['purple', '<circle cx="12" cy="6" r="2.5"/><path d="M6.5 9.5h11l2 10.5h-15z"/>'],
  Temperature: ['magenta', '<path d="M14 14.8V4.5a2 2 0 0 0-4 0v10.3a4 4 0 1 0 4 0z"/><path d="M12 10v7"/>'],
  Volume: ['teal', '<path d="M6 3h12l-1.6 17.1a1 1 0 0 1-1 .9H8.6a1 1 0 0 1-1-.9z"/><path d="M6.6 9h10.8"/>'],
  Area: ['green', '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/>'],
  Speed: ['yellow', '<path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 18 4-6"/>'],
  Data: ['lime', '<ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/>']
};

const KEY = 'converter-v1';
const S = Object.assign({ cat: 'Length', pick: {}, val: '1', prec: 16 }, load(KEY, {}));
const persist = () => save(KEY, S);

/* ---- parsing ---- */
function parseFrac(s) {            // "3", "3.5", "1/2", "3 1/2", "-1 1/2"
  s = s.trim(); if (!s) return NaN;
  const m = s.match(/^(-)?\s*(\d+(?:\.\d+)?)?(?:\s+|^)?(?:(\d+)\s*\/\s*(\d+))?$/);
  if (!m || (m[2] == null && m[3] == null)) return parseFloat(s.replace(/,/g, ''));
  let v = m[2] ? parseFloat(m[2]) : 0;
  if (m[3]) v += (+m[3]) / (+m[4] || 1);
  return m[1] ? -v : v;
}
function parseFtIn(s) {            // 5'3", 5' 3 1/2", 5 ft 3.5 in, 5-3, 63 (inches)
  s = s.trim().replace(/[”″]/g, '"').replace(/[’′]/g, "'");
  let m = s.match(/^(-)?\s*(\d+(?:\.\d+)?)\s*(?:'|ft)\s*(.*)$/i);
  if (m) {
    const rest = m[3].replace(/(in|")\s*$/i, '').trim();
    const inch = rest ? parseFrac(rest) : 0;
    const v = (+m[2]) * 12 + (isNaN(inch) ? 0 : inch);
    return m[1] ? -v : v;
  }
  m = s.match(/^(-)?\s*(\d+)\s*-\s*(.+)$/);
  if (m) { const inch = parseFrac(m[3]); return (m[1] ? -1 : 1) * ((+m[2]) * 12 + (isNaN(inch) ? 0 : inch)); }
  return parseFrac(s.replace(/(in|")\s*$/i, ''));
}
function toBase(v, u, cat) {
  const f = CATS[cat].units[u];
  if (f === 'ftin') return v * .0254;
  if (Array.isArray(f)) return f[0](v);
  return v * f;
}
function fromBase(b, u, cat) {
  const f = CATS[cat].units[u];
  if (f === 'ftin') return b / .0254;
  if (Array.isArray(f)) return f[1](b);
  return b / f;
}

/* ---- formatting ---- */
function fmt(x) {
  if (!isFinite(x)) return '–';
  if (x === 0) return '0';
  const a = Math.abs(x);
  let s = a >= 1e12 || a < 1e-6 ? x.toExponential(4) : Number(x.toPrecision(a >= 1000 ? 8 : 6)).toString();
  if (s.includes('e')) return s;
  const [i, d] = s.split('.');
  return Number(i).toLocaleString() + (d ? '.' + d : '');
}
function frac(inches, den) {       // nearest 1/den as "3 1/2"
  const neg = inches < 0; inches = Math.abs(inches);
  let n = Math.round(inches * den), w = Math.floor(n / den); n -= w * den;
  let g = n, d = den; while (g && d % g) { const t = d % g; d = g; g = t; }
  if (n) { n /= g; d = den / g; }
  const s = n ? (w ? w + ' ' : '') + n + '/' + d : String(w);
  return (neg ? '−' : '') + s;
}
function fmtFtIn(inches) {
  const neg = inches < 0; inches = Math.abs(inches);
  let total = Math.round(inches * S.prec) / S.prec;
  const ft = Math.floor(total / 12), inch = total - ft * 12;
  return (neg ? '−' : '') + (ft ? ft + "' " : '') + frac(inch, S.prec) + '"';
}

/* ---- ui ---- */
function paintCats() {
  $('#cats').innerHTML = Object.keys(CATS).map(c => `<button class="${S.cat === c ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('');
  const [hue, glyph] = LOOK[S.cat];
  $('#card').className = 'card sec hue-' + hue;
  $('#catIc').className = 'ic ' + hue;
  $('#catIc').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${glyph}</svg>`;
  $('#catName').textContent = S.cat;
}
function paintUnits() {
  const [f, t] = S.pick[S.cat] || DEFAULT[S.cat];
  const opts = sel => Object.keys(CATS[S.cat].units).map(u => `<option value="${esc(u)}"${u === sel ? ' selected' : ''}>${esc(u)}</option>`).join('');
  $('#from').innerHTML = opts(f); $('#to').innerHTML = opts(t);
}
function convert() {
  const cat = S.cat, from = $('#from').value, to = $('#to').value, raw = $('#val').value;
  S.pick[cat] = [from, to]; S.val = raw; persist();
  const v = from === 'ft in' ? parseFtIn(raw) : parseFrac(raw);
  $('#hint').textContent = from === 'ft in' ? 'Type 5\' 3 1/2", 5 ft 3.5 in, 5-3, or inches' : (cat === 'Length' ? 'Fractions work: 3 1/2' : '');
  $('#outName').textContent = 'In ' + (NAMES[to] || to);
  $('#outUnit').textContent = to === 'ft in' ? '' : to;
  if (isNaN(v)) { $('#out').textContent = '–'; $('#sub').textContent = raw.trim() ? 'Numbers only' : 'Type an amount'; $('#table').innerHTML = ''; $('#table').hidden = true; return; }
  const b = toBase(v, from, cat), r = fromBase(b, to, cat);
  $('#out').textContent = to === 'ft in' ? fmtFtIn(r) : fmt(r);
  let sub = '';
  if (to === 'in') sub = '≈ ' + frac(r, S.prec) + ' in (to 1/' + S.prec + ')';
  if (to === 'ft in') sub = fmt(r) + ' in · ' + fmt(r / 12) + ' ft';
  if (cat === 'Temperature' && to === '°C') sub = r <= 0 ? 'Freezing' : r >= 100 ? 'Boiling' : '';
  $('#sub').textContent = sub || 'Tap to copy';
  $('#table').hidden = false;
  $('#table').innerHTML = Object.keys(CATS[cat].units).filter(u => u !== from).map(u => {
    const x = fromBase(b, u, cat);
    return `<button class="ur${u === to ? ' on' : ''}" data-u="${esc(u)}"><span class="u">${esc(u)}<small>${esc(NAMES[u] || '')}</small></span><span class="v">${u === 'ft in' ? fmtFtIn(x) : fmt(x)}</span></button>`;
  }).join('');
}

$('#cats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  S.cat = b.dataset.cat; buzz(8); paintCats(); paintUnits(); convert();
});
$('#from').addEventListener('change', convert);
$('#to').addEventListener('change', convert);
$('#val').addEventListener('input', convert);
$('#swap').onclick = () => {
  buzz(8);
  const f = $('#from').value, t = $('#to').value, out = $('#out').textContent;
  $('#from').value = t; $('#to').value = f;
  if (out !== '–') $('#val').value = out.replace(/[≈,]/g, '').replace('−', '-');
  convert();
};
$('#table').addEventListener('click', e => { const b = e.target.closest('[data-u]'); if (b) { $('#to').value = b.dataset.u; buzz(6); convert(); } });
$('#outCard').onclick = async () => { const t = $('#out').textContent; if (t !== '–') toast(await copy(t) ? 'Copied ' + t : "Couldn't copy"); };
$('#setBtn').onclick = () => {
  const el = sheet(`<h2>Settings</h2>${themeSegHTML()}
    <div class="label">Round inches to</div>
    <div class="seg">${[16, 8, 32, 64].map(p => `<button data-prec="${p}" class="${S.prec === p ? 'on' : ''}">1/${p}</button>`).join('')}</div>`);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-prec]'); if (!b) return;
    S.prec = +b.dataset.prec; persist(); el.querySelectorAll('[data-prec]').forEach(x => x.classList.toggle('on', x === b)); convert();
  });
};

paintCats(); paintUnits(); $('#val').value = S.val; convert();
$('#val').focus();
</script>
</body>
</html>
