<rect x="96" y="96" width="140" height="140" rx="34" fill="#579DFF"/>
<rect x="276" y="96" width="140" height="140" rx="34" fill="#FEA362"/>
<rect x="96" y="276" width="140" height="140" rx="34" fill="#4BCE97"/>
<rect x="276" y="276" width="140" height="140" rx="34" fill="#9F8FEF"/>
</svg>
